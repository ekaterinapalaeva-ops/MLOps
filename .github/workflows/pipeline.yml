name: Tourism Project Pipeline

on:
  push:
    branches:
      - main  # Automatically triggers on push to the main branch
  workflow_dispatch:  # lets you click "Run workflow" in the Actions tab

concurrency:
  group: tourism-pipeline-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r mlops/deployment/requirements.txt   # Replace with the path to your project's requirements file.
      - name: Register Dataset
        run: python mlops/model_building/data_register.py   # Replace with the path to your dataset registration script.
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: mlops/data/tourism.csv   # Replace with the path to the raw dataset inside your data folder.

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r mlops/deployment/requirements.txt   # Replace with the path to your project's requirements file.
      - name: Run Data Preparation
        run: python mlops/model_building/prep.py   # Replace with the path to your data preparation script.
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-traning:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r mlops/deployment/requirements.txt   # Replace with the path to your project's requirements file.
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &  # Run MLflow UI in the background
          sleep 5  # Wait for a moment to let the server starts
      - name: Model Building
        run: python mlops/model_building/train.py   # Replace blanks with the path to your model training script.
      - name: Commit Trained Model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure the local branch has the latest remote history.
          git fetch origin main
          git rebase origin/main

          git add mlops/deployment/*.joblib

          # Do not fail when the model has not changed.
          if git diff --cached --quiet; then
            echo "No model changes to commit"
            exit 0
          fi

          git commit -m "Add trained model [skip ci]"

          # Handle a push that races with another workflow run.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed; rebasing onto the latest main branch"
            git fetch origin main
            git rebase origin/main
          done

          echo "Unable to push after multiple attempts"
          exit 1
       
